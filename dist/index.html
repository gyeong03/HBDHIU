nt.querySelectorAll('.answer').forEach((b,i)=>b.textContent=n.c[i])}function close(){active=null;document.querySelector('#menu').classList.remove('open')}document.querySelector('#x').onclick=close;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,s=document.querySelector('#speech');if(i!==active.a){s.innerHTML=`<b>${active.n}</b> · ${active.h}<br><em>다시 골라 보세요.</em>`;s.classList.add('show');return}done.add(active);s.innerHTML=`<b>${active.n}</b> · 맞아! 오늘의 스탬프를 받아 줘!`;s.classList.add('show');toast(`${active.n}의 스탬프를 얻었습니다.`);hud();close();if(done.size===3)setTimeout(()=>document.querySelector('#finish').hidden=false,1200)});function move(v,n){if(!player)return;let go=()=>{let d=v.clone().sub(player.position);d.y=0;if(d.length()<.08){player.position.copy(v);if(n){player.lookAt(n.o.position.x,player.position.y,n.o.position.z);n.o.lookAt(player.position.x,n.o.position.y,n.o.position.z);open(n.d,n.o)}return}d.normalize();player.position.addScaledVector(d,.045);player.rotation.y=Math.atan2(d.x,d.z);requestAnimationFrame(go)};go()}cv.addEventListener('pointerdown',e=>{if(!started||active)return;let r=cv.getBoundingClientRect();pt.x=(e.clientX-r.left)/r.width*2-1;pt.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pt,C);let hits=ray.intersectObjects(S.children,true),o;for(let h of hits){o=h.object;while(o&&!o.userData.data)o=o.parent;if(o)break}if(o&&o.userData.data){let d=o.userData.data;if(done.has(d)){toast(`${d.n}과는 이미 이야기했어요.`);return}move(o.position.clone().add(new T.Vector3(.8,0,.65)),{d,o})}else{let h=ray.intersectObject(floor)[0];if(h)move(h.point)}});document.querySelector('#go').onclick=()=>{document.querySelector('#start').hidden=true;started=true;hud()};document.querySelector('#again').onclick=()=>{done.clear();document.querySelector('#finish').hidden=true;document.querySelector('#speech').classList.remove('show');if(player)player.position.set(0,0,3.7);hud()};hud();function loop(){requestAnimationFrame(loop);let d=clock.getDel /* 생활 공간의 가구 충돌 영역. 주인공의 중심점에 여유 폭을 더해 통과를 막습니다. */
