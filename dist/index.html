/* 단순 단일 메시 NPC는 GLTF 이미지 디코더를 거치지 않고, 검증된 버퍼와 PNG를 직접 결합합니다. */
async function mountNpcSkin(i){const buffer=await unpackGLB(npcAssetUrls[i]),data=new DataView(buffer),jsonLength=data.getUint32(12,true),json=JSON.parse(new TextDecoder().decode(buffer.slice(20,20+jsonLength)).replace(/\0+$/,'')),binaryStart=20+jsonLength+8,part=n=>{const v=json.bufferViews[n],from=binaryStart+(v.byteOffset||0);return buffer.slice(from,from+v.byteLength)},geometry=new T.BufferGeometry();geometry.setAttribute('position',new T.BufferAttribute(new Float32Array(part(0)),3));geometry.setAttribute('normal',new T.BufferAttribute(new Float32Array(part(1)),3));geometry.setAttribute('uv',new T.BufferAttribute(new Float32Array(part(2)),2));geometry.setIndex(new T.BufferAttribute(new Uint32Array(part(3)),1));geometry.computeBoundingSphere();const texture=await new T.TextureLoader().loadAsync('./assets/npc'+(i+1)+'.png');texture.colorSpace=T.SRGBColorSpace;const avatar=new T.Group(),body=new T.Mesh(geometry,new T.MeshBasicMaterial({map:texture}));body.castShadow=body.receiveShadow=true;avatar.add(body);placeNpcAvatar(i,{scene:avatar})}
/* 게임용으로 경량화한 GLB를 병렬로 장착해, 시작 화면에서 여섯 NPC가 함께 준비됩니다. */
/* 브라우저 이미지 디코더는 동시 처리 수가 제한되므로, 두 개씩만 장착합니다. */
window.__npcSkinLoad={loaded:0,failed:0};(async()=>{let next=0;async function worker(){while(next<npcAssetUrls.length){const i=next++;try{await mountNpcSkin(i);window.__npcSkinLoad.loaded++}catch(error){window.__npcSkinLoad.failed++;console.error('NPC skin load failed:',i+1,error)}}}await Promise.all([worker(),worker()])})();
</script><!-- compressed avatar package --></body></html>
