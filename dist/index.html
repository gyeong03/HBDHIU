<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#263c65" />
  <title>모모마을의 작은 만남</title>
  <meta name="description" content="친구들과 만나 퀴즈를 푸는 아이소메트릭 이벤트 미니게임" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ffcf4d' d='M32 4 60 32 32 60 4 32z'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23263c65'/%3E%3Cpath stroke='white' stroke-width='4' stroke-linecap='round' d='M23 34c5 7 13 7 18 0'/%3E%3C/svg%3E" />
  <style>[hidden]{display:none!important}
    :root{--ink:#263c65;--cream:#fffaf0;--coral:#ff716b;--mint:#8bd9c3;--yellow:#ffcf4d;--navy:#25385c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#6275a5 0,#2b4168 62%,#172744 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;color:var(--ink);overflow:hidden}button{font:inherit;cursor:pointer}.app{height:100dvh;display:grid;place-items:center;padding:16px}.game-shell{width:min(100%,1040px);height:min(100%,760px);position:relative;overflow:hidden;border:7px solid rgba(255,255,255,.82);border-radius:30px;background:#bcecf0;box-shadow:0 22px 70px #0b183b99}.topbar{position:absolute;top:18px;left:20px;right:20px;z-index:5;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{color:white;font-weight:900;font-size:clamp(18px,3vw,27px);letter-spacing:-.06em;text-shadow:0 3px 0 #355074}.brand b{color:var(--yellow)}.progress{background:#fffdf7e8;border:2px solid #fff;border-radius:99px;padding:9px 14px;font-weight:850;box-shadow:0 5px 16px #32446740;white-space:nowrap}.stamps{position:absolute;left:20px;bottom:18px;z-index:5;display:flex;gap:7px}.stamp{width:34px;height:34px;background:#fffdf7;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 10px #263c6530;font-size:19px}.stamp.off{filter:grayscale(1);opacity:.55}canvas{width:100%;height:100%;display:block;touch-action:none}.tip{position:absolute;bottom:20px;right:20px;z-index:4;background:#263c65d9;color:white;padding:10px 13px;border-radius:14px;font-size:14px;font-weight:700;pointer-events:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:linear-gradient(#19345b55,#19345ba8);backdrop-filter:blur(3px)}.card{width:min(100%,460px);text-align:center;background:#fffaf5;border:4px solid white;border-radius:28px;padding:34px 28px;box-shadow:0 20px 50px #19254265}.spark{font-size:46px;display:block;animation:float 2s ease-in-out infinite}.card h1{font-size:clamp(29px,5vw,42px);line-height:1.03;letter-spacing:-.08em;margin:12px 0}.card p{font-size:16px;line-height:1.6;margin:0 0 22px;color:#52637e}.primary{border:0;border-radius:15px;padding:15px 24px;background:var(--coral);color:white;font-weight:900;font-size:17px;box-shadow:0 5px 0 #cc4f54;transition:.15s}.primary:hover{transform:translateY(-2px)}.dialog{position:absolute;z-index:15;left:50%;bottom:18px;transform:translateX(-50%);width:min(calc(100% - 34px),680px);background:#fffdf8;border:4px solid #fff;border-radius:24px;box-shadow:0 18px 40px #17274466;padding:16px;display:none}.dialog.open{display:grid;grid-template-columns:92px 1fr;gap:13px}.portrait{background:linear-gradient(145deg,#ffce7b,#f46f7b);border-radius:19px;display:grid;place-items:center;font-size:52px;min-height:105px}.dialog-main{text-align:left}.dialog-name{font-weight:900;font-size:18px}.dialog-copy{margin:5px 0 10px;font-size:16px;line-height:1.45}.choices{display:grid;gap:7px}.choice{border:2px solid #dfe5ec;background:white;color:#314261;text-align:left;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;transition:.15s}.choice:hover{border-color:#ff9b72;background:#fff5ee}.feedback{margin-top:8px;font-weight:800;font-size:14px;color:#e35560}.feedback.good{color:#369a77}.done-btn{margin-top:9px;border:0;border-radius:10px;background:#263c65;color:white;padding:9px 14px;font-weight:800}.confetti{position:absolute;inset:0;z-index:30;pointer-events:none;overflow:hidden}.piece{position:absolute;width:11px;height:16px;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@keyframes float{50%{transform:translateY(-8px)}}@media(max-width:600px){.app{padding:0}.game-shell{border-radius:0;border:0;width:100%;height:100%}.topbar{top:12px;left:12px;right:12px}.brand{font-size:19px}.progress{font-size:13px;padding:8px 10px}.tip{bottom:12px;right:12px;font-size:12px}.stamps{left:12px;bottom:11px}.dialog{bottom:8px;width:calc(100% - 16px);padding:11px;border-radius:19px}.dialog.open{grid-template-columns:64px 1fr;gap:9px}.portrait{min-height:75px;font-size:38px;border-radius:13px}.dialog-copy{font-size:14px}.choice{font-size:13px;padding:8px}.card{padding:28px 20px}}
  </style>
</head>
<body><main class="app"><section class="game-shell" aria-label="모모마을 미니게임"><canvas id="game" aria-label="정원 라운지 게임 공간"></canvas><div class="topbar"><div class="brand">MOMO <b>GARDEN</b></div><div class="progress" id="progress">만난 친구 0/3</div></div><div class="stamps" id="stamps" aria-label="모은 스탬프"></div><div class="tip">바닥을 눌러 이동 · 친구를 눌러 대화</div><section class="dialog" id="dialog" aria-live="polite"><div class="portrait" id="portrait"></div><div class="dialog-main"><div class="dialog-name" id="dialogName"></div><div class="dialog-copy" id="dialogCopy"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div></div></section><div class="overlay" id="start"><div class="card"><span class="spark">✦</span><h1>모모마을의<br>작은 만남</h1><p>정원 라운지를 산책하며 세 친구의 이야기를 들어 보세요. 대화 속 퀴즈를 풀면 오늘의 스탬프가 완성돼요.</p><button class="primary" id="startBtn">산책 시작하기</button></div></div><div class="overlay" id="end" hidden><div class="card"><span class="spark">🎉</span><h1>오늘의 만남<br>완료!</h1><p>세 친구와 나눈 이야기가 스탬프에 담겼어요.<br>모모마을에서 멋진 하루를 보냈네요!</p><button class="primary" id="restartBtn">처음부터 다시 하기</button></div></div><div class="confetti" id="confetti"></div></section></main>
<script>
// ★ 이벤트 콘텐츠는 이 NPC_DATA만 교체하면 됩니다.
const NPC_DATA=[
 {id:'lumi',name:'루미',emoji:'🧑🏻‍🎨',x:285,y:222,color:'#f49a72',greet:'안녕! 꽃밭의 색을 고르다가 좋은 생각이 났어.',question:'식물이 햇빛으로 스스로 양분을 만드는 과정은 무엇일까?',choices:['광합성이야!','물의 여행이야!','바람의 춤이야!'],answer:0,hint:'햇빛과 잎이 만나는 과정의 이름을 떠올려 봐!'},
 {id:'bomi',name:'보미',emoji:'🧑🏽‍🍳',x:690,y:255,color:'#9d83e8',greet:'라운지에 둘 상쾌한 음료를 만들고 있었어.',question:'지구를 지키기 위해 쓰레기를 줄이는 실천으로 알맞은 것은?',choices:['일회용 컵을 더 받기','텀블러를 사용하기','포장을 여러 겹 하기'],answer:1,hint:'여러 번 오래 쓰는 물건을 골라 봐!'},
 {id:'dodo',name:'도도',emoji:'🧑🏼‍🔬',x:520,y:460,color:'#4bb4b5',greet:'반짝이는 별을 보며 산책 계획을 세우고 있었지!',question:'밤하늘에서 북쪽을 찾는 데 도움이 되는 별은?',choices:['북극성','샛별','유성'],answer:0,hint:'이름에 방향이 숨어 있는 별이야!'}
];
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),dialog=document.getElementById('dialog');let W,H,scale=1,active=null,started=false,player={x:455,y:405,tx:455,ty:405,joy:0},done=new Set(),pending=null,path=[],last=0;
const obstacles=[{x:430,y:255,w:205,h:82},{x:160,y:340,w:140,h:86},{x:670,y:400,w:145,h:75},{x:370,y:500,w:155,h:52}];
function resize(){const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;W=r.width;H=r.height;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function iso(x,y){return {x:W/2+(x-y)*.78,y:88+(x+y)*.38}} function ground(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#9bdcba';ctx.fillRect(0,0,W,H);const p=iso(0,0),a=iso(920,0),b=iso(920,720),c=iso(0,720);ctx.beginPath();[p,a,b,c].forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fillStyle='#b8e5b0';ctx.fill();ctx.strokeStyle='#91c999';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();const r1=iso(75,420),r2=iso(870,420),r3=iso(870,495),r4=iso(75,495);[r1,r2,r3,r4].forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fillStyle='#f7d69c';ctx.fill();for(let i=0;i<22;i++){let x=90+i*35,y=455;let q=iso(x,y);ctx.fillStyle='#e8bb73';ctx.fillRect(q.x-10,q.y-2,20,3)}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function box(x,y,w,h,color,kind){let p=iso(x,y),a=iso(x+w,y),b=iso(x+w,y+h),c=iso(x,y+h),z=18;poly([p,a,{x:a.x,y:a.y+z},{x:p.x,y:p.y+z}],color);poly([a,b,{x:b.x,y:b.y+z},{x:a.x,y:a.y+z}],shade(color,-18));poly([p,c,{x:c.x,y:c.y+z},{x:p.x,y:p.y+z}],shade(color,-35));if(kind==='table'){ctx.fillStyle='#f8edcd';ctx.beginPath();ctx.ellipse((p.x+b.x)/2,(p.y+b.y)/2,Math.abs(a.x-p.x)*.55,15,0,0,Math.PI*2);ctx.fill();for(const q of [p,a,b,c]){ctx.strokeStyle='#795739';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(q.x,q.y+12);ctx.lineTo(q.x,q.y+31);ctx.stroke()}}}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+amt)),g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),b=Math.max(0,Math.min(255,(n&255)+amt));return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0')}
function plant(x,y){let q=iso(x,y);ctx.fillStyle='#6d4b39';ctx.fillRect(q.x-7,q.y-8,14,15);for(let i=0;i<6;i++){let ang=i*Math.PI/3,px=q.x+Math.cos(ang)*13,py=q.y-15+Math.sin(ang)*7;ctx.fillStyle=i%2?'#49ac77':'#74c67e';ctx.beginPath();ctx.ellipse(px,py,10,5,ang,0,Math.PI*2);ctx.fill()}}
function character(c,isPlayer,t){let q=iso(c.x,c.y),bob=Math.sin(t/250+c.x)*2,joy=c.joy?Math.abs(Math.sin(t/75))*12:0;ctx.save();ctx.translate(q.x,q.y+bob-joy);ctx.fillStyle='#00000022';ctx.beginPath();ctx.ellipse(0,10,18,6,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4e3550';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-7,3);ctx.lineTo(-9,12);ctx.moveTo(7,3);ctx.lineTo(9,12);ctx.stroke();ctx.fillStyle=c.color||'#ff8377';ctx.fillRect(-11,-13,22,20);ctx.fillStyle='#f0b08f';ctx.beginPath();ctx.arc(0,-25,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#573a37';ctx.beginPath();ctx.arc(0,-28,13,Math.PI,0);ctx.fill();ctx.fillStyle='#25385c';ctx.beginPath();ctx.arc(-4,-25,1.6,0,7);ctx.arc(4,-25,1.6,0,7);ctx.fill();ctx.strokeStyle='#e77765';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-20,4,0,Math.PI);ctx.stroke();if(isPlayer){ctx.fillStyle='#75d954';ctx.beginPath();ctx.moveTo(0,-58);ctx.lineTo(-10,-39);ctx.lineTo(10,-39);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.stroke()}else{ctx.fillStyle=done.has(c.id)?'#78c969':'#fff';ctx.beginPath();ctx.arc(0,-56,11,0,7);ctx.fill();ctx.fillStyle=done.has(c.id)?'#fff':'#ee7a76';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(done.has(c.id)?'✓':'!',0,-50)}ctx.restore()}
function draw(t){ground();box(430,255,205,82,'#b48766','table');box(160,340,140,86,'#8ab7d0');box(670,400,145,75,'#e7a65d');box(370,500,155,52,'#c49a7d','table');[[110,140],[215,180],[760,120],[810,260],[150,565],[710,570],[360,165],[615,555]].forEach(p=>plant(...p));NPC_DATA.forEach(n=>character(n,false,t));character(player,true,t);if(started)requestAnimationFrame(draw)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function blocked(x,y){return obstacles.some(o=>x>o.x-30&&x<o.x+o.w+30&&y>o.y-30&&y<o.y+o.h+30)}function planPath(tx,ty){const g=20,cols=47,rows=37,key=(x,y)=>x+','+y,cell=(x,y)=>({x:Math.max(10,Math.min(910,x*g+10)),y:Math.max(10,Math.min(710,y*g+10))}),s={x:Math.round((player.x-10)/g),y:Math.round((player.y-10)/g)},e={x:Math.round((tx-10)/g),y:Math.round((ty-10)/g)},q=[s],seen=new Map([[key(s.x,s.y),null]]);for(let i=0;i<q.length;i++){let n=q[i];if(n.x===e.x&&n.y===e.y)break;for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=n.x+d[0],ny=n.y+d[1],k=key(nx,ny),p=cell(nx,ny);if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&!seen.has(k)&&!blocked(p.x,p.y)){seen.set(k,n);q.push({x:nx,y:ny})}}}let cur=e,out=[];if(!seen.has(key(e.x,e.y))){path=[];return}while(cur){out.push(cell(cur.x,cur.y));cur=seen.get(key(cur.x,cur.y))}path=out.reverse().filter((_,i)=>i%2===0);player.tx=path[0]?.x??tx;player.ty=path[0]?.y??ty}function move(t){if(!started)return;let dx=player.tx-player.x,dy=player.ty-player.y,d=Math.hypot(dx,dy);if(d>1){let step=Math.min(2.4,d);player.x+=dx/d*step;player.y+=dy/d*step}else{path.shift();if(path.length){player.tx=path[0].x;player.ty=path[0].y}else if(pending){openDialog(pending);pending=null}}setTimeout(()=>move(),16)}
function screenToWorld(px,py){let best={x:0,y:0,d:1e9};for(let x=0;x<=920;x+=10)for(let y=0;y<=720;y+=10){let q=iso(x,y),d=(q.x-px)**2+(q.y-py)**2;if(d<best.d)best={x,y,d};}return best}
cv.addEventListener('pointerdown',e=>{if(!started||dialog.classList.contains('open'))return;let r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let hit=NPC_DATA.find(n=>{let q=iso(n.x,n.y);return Math.hypot(q.x-px,q.y-py)<44});if(hit){if(done.has(hit.id)){showMini(hit.name+'과는 이미 즐겁게 이야기했어요!');return}pending=hit;planPath(hit.x-42,hit.y+42)}else{let w=screenToWorld(px,py);if(!blocked(w.x,w.y)){pending=null;planPath(w.x,w.y)}}});
function openDialog(n){active=n;document.getElementById('portrait').textContent=n.emoji;document.getElementById('dialogName').textContent=n.name;document.getElementById('dialogCopy').textContent=n.greet+' '+n.question;document.getElementById('feedback').textContent='';renderChoices();dialog.classList.add('open')}
function renderChoices(){let area=document.getElementById('choices');area.innerHTML='';active.choices.forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(i);area.append(b)})}function answer(i){let f=document.getElementById('feedback');if(i!==active.answer){f.className='feedback';f.textContent='아쉽지만 다시 생각해 볼까? '+active.hint;return}done.add(active.id);active.joy=1;f.className='feedback good';f.textContent='정답! '+active.name+'이(가) 기뻐하며 스탬프를 건넸어요. ✦';document.getElementById('choices').innerHTML='<button class="done-btn">고마워! 다음 친구 만나기</button>';document.querySelector('.done-btn').onclick=closeDialog;update();if(done.size===3){setTimeout(finish,1100)}}
function closeDialog(){dialog.classList.remove('open');if(active)active.joy=0;active=null}function update(){document.getElementById('progress').textContent=`만난 친구 ${done.size}/3`;document.getElementById('stamps').innerHTML=NPC_DATA.map(n=>`<span class="stamp ${done.has(n.id)?'':'off'}">${done.has(n.id)?'✦':'○'}</span>`).join('')}function showMini(s){document.querySelector('.tip').textContent=s;setTimeout(()=>document.querySelector('.tip').textContent='바닥을 눌러 이동 · 친구를 눌러 대화',1900)}function finish(){closeDialog();for(let i=0;i<70;i++){let d=document.createElement('i');d.className='piece';d.style.left=Math.random()*100+'%';d.style.top=(-10-Math.random()*40)+'px';d.style.background=['#ff716b','#ffcf4d','#8bd9c3','#a889e8'][i%4];d.style.animationDelay=Math.random()*.5+'s';document.getElementById('confetti').append(d)}document.getElementById('end').hidden=false}function reset(){done.clear();player.x=455;player.y=405;player.tx=455;player.ty=405;document.getElementById('end').hidden=true;document.getElementById('confetti').innerHTML='';update()}document.getElementById('startBtn').onclick=()=>{document.getElementById('start').hidden=true;started=true;update();requestAnimationFrame(draw);move()};document.getElementById('restartBtn').onclick=reset;update();
</script></body></html>
