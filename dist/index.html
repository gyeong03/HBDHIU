function rounded(w,h,d,r,m){let g=new T.Group(),q=Math.min(r,w*.22,d*.22),b=new T.BoxGeometry(1,h,1);piece(g,b,m,0,0,0,0,0,0).scale.set(w-2*q,1,d);piece(g,b,m,0,0,0,0,0,0).scale.set(w,1,d-2*q);for(let x of[-1,1])for(let z of[-1,1])piece(g,new T.CylinderGeometry(q,q,h,12),m,x*(w/2-q),0,z*(d/2-q));return g}function rug(x,z,w,d,m){let g=rounded(w,.045,d,.13,m);g.position.y=.025;place(g,x,z);return g}

function cabinet(x,z){let g=new T.Group(),body=rounded(2.45,1.28,.68,.1,M.teal);body.position.y=.68;g.add(body);let kick=rounded(2.2,.13,.53,.04,M.dark);kick.position.set(0,.11,-.04);g.add(kick);let top=rounded(2.62,.14,.82,.09,M.cream);top.position.y=1.38;g.add(top);for(let a of[-.62,.62]){let door=rounded(.94,.9,.04,.045,M.teal);door.position.set(a,.69,-.375);g.add(door);piece(g,new T.SphereGeometry(.05,10,8),M.brass,a+.28,.7,-.42)}for(let a of[-.94,.94])piece(g,new T.CylinderGeometry(.07,.085,.16,8),M.wood,a,.08,0);piece(g,new T.CylinderGeometry(.19,.17,.08,16),M.ceramic,-.6,1.53,.04);piece(g,new T.TorusGeometry(.15,.025,8,14),M.brass,-.6,1.57,.04,Math.PI/2);piece(g,new T.CylinderGeometry(.11,.09,.29,12),M.terracotta,.35,1.57,.08);leafy(g,.35,1.7,.08,.36,1);place(g,x,z);return g}function bookshelf(x,z){let g=new T.Group(),body=rounded(1.36,2.18,.46,.07,M.wood);body.position.y=1.09;g.add(body);for(let y of[.42,1.02,1.62]){piece(g,new T.BoxGeometry(1.16,.075,.4),M.woodLight,0,y,-.27);for(let i=0;i<5;i++){let book=piece(g,new T.BoxGeometry(.12,.34+(i%2)*.09,.18),[M.terracotta,M.mustard,M.teal,M.cream,M.sage][i],-.45+i*.22,y+.2,-.39);book.rotation.z=(i-2)*.055}}place(g,x,z);return g}function wallShelf(x,z){let g=new T.Group();piece(g,new T.BoxGeometry(1.45,.1,.3),M.woodLight,0,1.95,0);for(let i=0;i<4;i++){let book=piece(g,new T.BoxGeometry(.12,.42+(i%2)*.08,.18),[M.terracotta,M.mustard,M.teal,M.cream][i],-.42+i*.22,2.21,-.07);book.rotation.z=(i-1.5)*.05}piece(g,new T.SphereGeometry(.14,12,8),M.ceramic,.45,2.12,-.04);leafy(g,.45,2.17,-.04,.38,0);place(g,x,z);return g}
function floorLamp(x,z){let g=new T.Group();piece(g,new T.CylinderGeometry(.25,.32,.07,16),M.brass,0,.04,0);piece(g,new T.CylinderGeometry(.045,.055,1.65,10),M.dark,0,.86,0);piece(g,new T.ConeGeometry(.35,.24,16,1,true),M.cream,0,1.76,0,Math.PI,0,0);let glow=piece(g,new T.SphereGeometry(.11,10,8),new T.MeshStandardMaterial({color:'#ffe9b9',emissive:'#ffe0a0',emissiveIntensity:.55}),0,1.67,0);glow.castShadow=false;place(g,x,z);return g}function wallArt(x,y,z,w,h,c){box([w+.12,h+.12,.055],[x,y,z],M.wood);box([w,h,.035],[x,y,z-.04],c)}function windowUnit(x,z,w=2){box([w,1.72,.06],[x,2.35,z],M.glass);box([w+.14,.1,.1],[x,3.24,z-.04],M.trim);box([w+.14,.1,.1],[x,1.46,z-.04],M.trim);box([.1,1.84,.1],[x-w/2,2.35,z-.04],M.trim);box([.1,1.84,.1],[x+w/2,2.35,z-.04],M.trim);box([.06,1.63,.1],[x,2.35,z-.06],M.trim)}
